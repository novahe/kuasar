[workspace]
members = [
    "vmm/task",
    "vmm/sandbox",
    "vmm/common",
    "runc",
    "quark",
    "wasm",
    "shim",
    "tools/kuasar-ctl",
]
exclude = [
    "tests/e2e"
]
resolver = "2"

[profile.release]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
ttrpc = { git = "https://github.com/kuasar-io/ttrpc-rust.git", branch = "v0.7.1-kuasar" }

[patch."https://github.com/kuasar-io/rust-extensions.git"]
containerd-shim = { path = "third_party/rust-extensions-compat/crates/shim" }
runc = { path = "third_party/rust-extensions-compat/crates/runc" }
